[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ly2mxml"
version = "0.1.0"
description = "LilyPond to MusicXML conversion tooling"
requires-python = ">=3.12"
dependencies = [
  "python-ly>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "music21>=10.3",
]

[project.scripts]
ly2mxml = "ly2mxml.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.coverage.run]
source = ["ly2mxml"]
omit = ["src/ly2mxml/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
